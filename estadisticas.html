<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadísticas Generales</title>
<style>
:root{
  --teal-50:#FDEEE2;--teal-600:#C2570D;--teal-800:#8C3F09;--teal-900:#5C2906;
  --green-50:#EAF3DE;--green-600:#2E7D0E;--green-800:#27500A;
  --blue-50:#E6F1FB;--blue-800:#0C447C;
  --amber-50:#FAEEDA;--amber-600:#854F0B;--amber-800:#5C3308;
  --purple-50:#EEEDFE;--purple-800:#3C3489;
  --red-50:#FCEBEB;--red-600:#A32D2D;
  --coral-50:#FAECE7;--coral-800:#712B13;
  --pink-50:#FBEAF0;--pink-800:#72243E;
  --bg:#F7F6F2;--surface:#FFFFFF;--surface-1:#F1F0EA;
  --text-primary:#1F1F1D;--text-secondary:#5F5E5A;--text-muted:#888780;
  --border:#E3E1D8;--radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text-primary);font-size:14px;}
.wrap{max-width:1020px;margin:0 auto;padding:20px 20px 80px;}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);text-decoration:none;border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;background:#fff;flex-shrink:0;}
.back-btn:hover{border-color:var(--teal-600);color:var(--teal-800);}
.back-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
.header-text{flex:1}
.eyebrow{font-size:11px;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase;}
h1{font-size:20px;font-weight:600;color:var(--teal-900);margin-top:2px;}
.btn-secondary{background:#fff;border:1px solid var(--border);border-radius:var(--radius);height:36px;padding:0 14px;color:var(--text-secondary);cursor:pointer;font-family:inherit;font-size:13px;display:flex;align-items:center;gap:6px;}
.btn-secondary:hover{border-color:var(--teal-600);color:var(--teal-800);}
.btn-secondary svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
/* Section label */
.section-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin:28px 0 12px;}
.section-label:first-child{margin-top:0;}
/* Stat hero row */
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:28px;}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;}
.hero-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.hero-icon svg{width:18px;height:18px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.hero-value{font-size:28px;font-weight:700;line-height:1;color:var(--teal-900);}
.hero-label{font-size:12px;color:var(--text-secondary);margin-top:4px;}
/* Module cards */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:24px;}
.mod-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;}
.mod-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.mod-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mod-icon svg{width:18px;height:18px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.mod-title{font-size:13px;font-weight:700;color:var(--text-primary);}
.mod-sub{font-size:11px;color:var(--text-muted);margin-top:1px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13px;}
.stat-row:first-child{border-top:none;}
.stat-row span:first-child{color:var(--text-secondary);}
.stat-row strong{color:var(--text-primary);}
/* Bar */
.bar-wrap{margin-top:10px;}
.bar-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.bar-label{font-size:11px;color:var(--text-secondary);width:140px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:8px;background:var(--surface-1);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--teal-600);transition:width .4s ease;}
.bar-count{font-size:11px;font-weight:700;color:var(--text-secondary);width:28px;text-align:right;flex-shrink:0;}
/* Hoy badge */
.hoy-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--green-50);color:var(--green-800);}
/* Empty */
.no-data{font-size:12px;color:var(--text-muted);padding:12px 0;text-align:center;}
footer{text-align:center;font-size:11px;color:var(--text-muted);margin-top:40px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="wrap">
  <header>
      <a class="back-btn" href="index.html">
        <svg viewBox="0 0 14 14"><path d="M9 3L5 7l4 4" stroke-linejoin="round"/></svg>Inicio
      </a>
      <div class="header-text">
        <p class="eyebrow">Clínica Dental Universitaria Anáhuac</p>
        <h1>Estadísticas Generales</h1>
      </div>
    </header>
  <div id="dashboard"></div>
  <footer>Control interno · Clínica Dental Universitaria Anáhuac Xalapa</footer>
</div>

<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function todayISO(){const d=new Date();const p=v=>String(v).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function mesISO(){return todayISO().slice(0,7);}
function fmtFecha(s){if(!s)return'—';const[y,m,d]=s.split('-');const ms=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${parseInt(d)} ${ms[parseInt(m)-1]} ${y}`;}
const SB_URL='https://mkatcueeyxgetschqplm.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rYXRjdWVleXhnZXRzY2hxcGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MjUyNTgsImV4cCI6MjEwMDQwMTI1OH0.YQgp2pYMKHyv21GpYLaO3u8VXOuPWMqWuUaYbgzcXwY';
const sbST=window.supabase.createClient(SB_URL,SB_KEY);
async function cargarTodosLosDatos(){
  const[expRes,aluRes,maeRes,pagRes,presRes,eqRes,bancoRes,ceyeRes,justRes,consRes,asisRes,asisSSRes]=await Promise.all([
    sbST.from('expedientes').select('*'),
    sbST.from('alumnos').select('*'),
    sbST.from('maestros').select('*'),
    sbST.from('pagos_visitas').select('*'),
    sbST.from('prestamos').select('*'),
    sbST.from('equipos').select('*'),
    sbST.from('banco_pacientes').select('*'),
    sbST.from('ceye').select('*'),
    sbST.from('justificantes').select('*'),
    sbST.from('consentimientos').select('*'),
    sbST.from('asistencia').select('*'),
    sbST.from('asistencia_ss').select('*')
  ]);
  return{
    expedientes:expRes.data||[],
    alumnos:aluRes.data||[],
    maestros:maeRes.data||[],
    pagos:pagRes.data||[],
    prestamos:presRes.data||[],
    equipos:eqRes.data||[],
    banco:bancoRes.data||[],
    ceye:ceyeRes.data||[],
    justificantes:justRes.data||[],
    consentimientos:consRes.data||[],
    asistencia:asisRes.data||[],
    asistenciaSS:asisSSRes.data||[]
  };
}

function icon(paths,strokeColor){
  return`<svg viewBox="0 0 24 24" style="stroke:${strokeColor}">${paths}</svg>`;
}

function barChart(items,max){
  if(!items||!items.length)return`<p class="no-data">Sin datos</p>`;
  return`<div class="bar-wrap">${items.map(([label,count])=>{
    const pct=max>0?Math.round((count/max)*100):0;
    return`<div class="bar-item">
      <span class="bar-label" title="${esc(label)}">${esc(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-count">${count}</span>
    </div>`;
  }).join('')}</div>`;
}

function statRows(rows){
  return rows.map(([l,v,hoy])=>`<div class="stat-row"><span>${l}</span><div style="display:flex;align-items:center;gap:6px;"><strong>${v}</strong>${hoy?`<span class="hoy-badge">+${hoy} hoy</span>`:''}</div></div>`).join('');
}

let datos = {expedientes:[],alumnos:[],maestros:[],pagos:[],prestamos:[],equipos:[],banco:[],ceye:[],justificantes:[],consentimientos:[],asistencia:[],asistenciaSS:[]};

function renderAll(){
  const hoy=todayISO(), mes=mesISO();
  let html='';

  const D = datos;

  /* ══ RESUMEN GLOBAL ══ */
  const totalPac = D.expedientes.length;
  const totalAlumnos = D.alumnos.length;
  const totalMaestros = D.maestros.length;
  const totalJust = D.justificantes.length;
  const totalPrest = D.prestamos.length;
  const totalCeye = D.ceye.length;
  const totalBanco = D.banco.length;
  const totalCons = D.consentimientos.length;

  html+=`<p class="section-label">Resumen global</p>
  <div class="hero-grid">
    <div class="hero-card">
      <div class="hero-icon" style="background:var(--coral-50);">${icon('<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>','#712B13')}</div>
      <p class="hero-value">${totalPac}</p><p class="hero-label">Expedientes</p>
    </div>
    <div class="hero-card">
      <div class="hero-icon" style="background:var(--purple-50);">${icon('<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>','#3C3489')}</div>
      <p class="hero-value">${totalAlumnos}</p><p class="hero-label">Alumnos</p>
    </div>
    <div class="hero-card">
      <div class="hero-icon" style="background:var(--red-50);">${icon('<circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/>','#A32D2D')}</div>
      <p class="hero-value">${totalMaestros}</p><p class="hero-label">Maestros</p>
    </div>
    <div class="hero-card">
      <div class="hero-icon" style="background:var(--blue-50);">${icon('<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M17 11h4M19 9v4"/>','#0C447C')}</div>
      <p class="hero-value">${totalBanco}</p><p class="hero-label">Banco pacientes</p>
    </div>
    <div class="hero-card">
      <div class="hero-icon" style="background:var(--green-50);">${icon('<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>','#27500A')}</div>
      <p class="hero-value">${totalJust}</p><p class="hero-label">Justif. y Recetas</p>
    </div>
    <div class="hero-card">
      <div class="hero-icon" style="background:var(--teal-50);">${icon('<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h2"/><path d="M15 16l1.5 1.5L19 14"/>','#8C3F09')}</div>
      <p class="hero-value">${totalCons}</p><p class="hero-label">Consentimientos</p>
    </div>
    <div class="hero-card">
      <div class="hero-icon" style="background:var(--amber-50);">${icon('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>','#854F0B')}</div>
      <p class="hero-value">${totalCeye}</p><p class="hero-label">Registros CeYE</p>
    </div>
    <div class="hero-card">
      <div class="hero-icon" style="background:var(--pink-50);">${icon('<path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2M6 17v2a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-2"/>','#72243E')}</div>
      <p class="hero-value">${totalPrest}</p><p class="hero-label">Préstamos</p>
    </div>
  </div>`;

  /* ══════════════════════════════════════════════════════════
     SECCIÓN 1 — CONTROL DE PAGOS Y VISITAS
     ══════════════════════════════════════════════════════════ */
  const pagos = D.pagos;
  const pagosHoy = pagos.filter(p=>p.fecha===hoy);
  const pagosMes = pagos.filter(p=>(p.fecha||'').startsWith(mes));

  // Procedimientos realizados
  const procConteo={};
  pagos.forEach(p=>{
    (p.tratamientos||[]).forEach(t=>{
      if(!t?.nombre)return;
      procConteo[t.nombre]=(procConteo[t.nombre]||0)+(Number(t.cantidad)||1);
    });
  });
  const procTop=Object.entries(procConteo).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxProc=Math.max(...procTop.map(p=>p[1]),1);
  const totalProcs=Object.values(procConteo).reduce((s,n)=>s+n,0);

  // Visitas por clínica
  const clinicaConteo={};
  pagos.forEach(p=>{
    const c=p.clinica||'Sin asignar';
    clinicaConteo[c]=(clinicaConteo[c]||0)+1;
  });
  const clinicaTop=Object.entries(clinicaConteo).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxClinica=Math.max(...clinicaTop.map(c=>c[1]),1);

  // Visitas por lugar de atención
  const lugarConteo={};
  pagos.forEach(p=>{
    const l=p.lugar_pago||p.lugarPago||'Sin registrar';
    lugarConteo[l]=(lugarConteo[l]||0)+1;
  });
  const lugarTop=Object.entries(lugarConteo).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxLugar=Math.max(...lugarTop.map(l=>l[1]),1);

  // Pacientes más atendidos
  const pacConteo={};
  pagos.forEach(p=>{
    const n=p.paciente||'Sin nombre';
    pacConteo[n]=(pacConteo[n]||0)+1;
  });
  const pacTop=Object.entries(pacConteo).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxPac=Math.max(...pacTop.map(p=>p[1]),1);

  // Tendencia últimos 7 días
  const ultimos7=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    const label=d.toLocaleDateString('es-MX',{weekday:'short',day:'2-digit'});
    ultimos7.push([label, pagos.filter(p=>p.fecha===iso).length]);
  }
  const max7=Math.max(...ultimos7.map(d=>d[1]),1);

  const promedioProcs = pagos.length>0 ? (totalProcs/pagos.length).toFixed(1) : '0';

  html+=`<p class="section-label">Control de pagos y visitas</p>
  <div class="hero-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px;">
    <div class="hero-card"><p class="hero-value">${pagos.length}</p><p class="hero-label">Visitas totales</p></div>
    <div class="hero-card"><p class="hero-value">${pagosHoy.length}</p><p class="hero-label">Visitas hoy</p></div>
    <div class="hero-card"><p class="hero-value">${pagosMes.length}</p><p class="hero-label">Visitas este mes</p></div>
    <div class="hero-card"><p class="hero-value">${totalProcs}</p><p class="hero-label">Procedimientos</p></div>
    <div class="hero-card"><p class="hero-value">${promedioProcs}</p><p class="hero-label">Proc. por visita</p></div>
  </div>
  <div class="mod-grid">
    <div class="mod-card">
      <div class="mod-head"><span class="mod-title">Procedimientos más realizados</span></div>
      ${barChart(procTop,maxProc)}
    </div>
    <div class="mod-card">
      <div class="mod-head"><span class="mod-title">Visitas por clínica / materia</span></div>
      ${barChart(clinicaTop,maxClinica)}
    </div>
    <div class="mod-card">
      <div class="mod-head"><span class="mod-title">Tendencia últimos 7 días</span></div>
      ${barChart(ultimos7,max7)}
    </div>
    <div class="mod-card">
      <div class="mod-head"><span class="mod-title">Pacientes más atendidos</span></div>
      ${barChart(pacTop,maxPac)}
    </div>
    <div class="mod-card">
      <div class="mod-head"><span class="mod-title">Lugar de atención</span></div>
      ${barChart(lugarTop,maxLugar)}
    </div>
  </div>`;

  /* ══════════════════════════════════════════════════════════
     SECCIÓN 2 — CONTROL POR ALUMNO
     ══════════════════════════════════════════════════════════ */
  const alumnos = D.alumnos;

  // Construir mapa de actividad por alumno
  const actividad = {};
  const nombreAlumnos = alumnos.map(a=>a.nombre).filter(Boolean);
  nombreAlumnos.forEach(n=>{
    actividad[n] = { visitas:0, procedimientos:0, pacientes:new Set(), justificantes:0, consentimientos:0, ceye:0, prestamos:0, asistencias:0, semestre:'' };
  });
  alumnos.forEach(a=>{ if(a.nombre && actividad[a.nombre]) actividad[a.nombre].semestre = a.semestre || ''; });

  const reg = (nombre) => {
    if(!nombre) return null;
    if(!actividad[nombre]) actividad[nombre] = { visitas:0, procedimientos:0, pacientes:new Set(), justificantes:0, consentimientos:0, ceye:0, prestamos:0, asistencias:0, semestre:'' };
    return actividad[nombre];
  };

  pagos.forEach(p=>{
    const a = reg(p.estudiante);
    if(!a) return;
    a.visitas++;
    if(p.paciente) a.pacientes.add(p.paciente);
    (p.tratamientos||[]).forEach(t=>{ if(t?.nombre) a.procedimientos += (Number(t.cantidad)||1); });
  });
  D.justificantes.forEach(j=>{ const a=reg(j.alumno); if(a) a.justificantes++; });
  D.consentimientos.forEach(c=>{ const a=reg(c.alumno); if(a) a.consentimientos++; });
  D.ceye.forEach(c=>{ const a=reg(c.alumno); if(a) a.ceye++; });
  D.prestamos.forEach(p=>{ if((p.tipo_resp||p.tipoResp)==='alumno'){ const a=reg(p.responsable); if(a) a.prestamos++; } });
  D.asistenciaSS.forEach(r=>{ const a=reg(r.nombre); if(a && r.tipo==='Entrada') a.asistencias++; });

  const listaAlumnos = Object.entries(actividad).map(([nombre,d])=>({
    nombre, semestre:d.semestre,
    visitas:d.visitas, procedimientos:d.procedimientos,
    pacientes:d.pacientes.size, justificantes:d.justificantes,
    consentimientos:d.consentimientos, ceye:d.ceye,
    prestamos:d.prestamos, asistencias:d.asistencias,
    total: d.visitas + d.justificantes + d.consentimientos + d.ceye + d.prestamos
  }));

  const alumnosActivos = listaAlumnos.filter(a=>a.total>0).length;
  const totalPacAtendidos = new Set(pagos.map(p=>p.paciente).filter(Boolean)).size;
  const promVisitas = alumnosActivos>0 ? (pagos.length/alumnosActivos).toFixed(1) : '0';

  const topVisitas = listaAlumnos.filter(a=>a.visitas>0).sort((a,b)=>b.visitas-a.visitas).slice(0,8).map(a=>[a.nombre,a.visitas]);
  const maxVis = Math.max(...topVisitas.map(a=>a[1]),1);

  const topProcs = listaAlumnos.filter(a=>a.procedimientos>0).sort((a,b)=>b.procedimientos-a.procedimientos).slice(0,8).map(a=>[a.nombre,a.procedimientos]);
  const maxPr = Math.max(...topProcs.map(a=>a[1]),1);

  const topPacientes = listaAlumnos.filter(a=>a.pacientes>0).sort((a,b)=>b.pacientes-a.pacientes).slice(0,8).map(a=>[a.nombre,a.pacientes]);
  const maxPa = Math.max(...topPacientes.map(a=>a[1]),1);

  // Por semestre
  const semConteo={};
  listaAlumnos.forEach(a=>{
    const s = a.semestre ? (String(a.semestre).includes('Semestre') ? a.semestre : 'Semestre '+a.semestre) : 'Sin semestre';
    semConteo[s]=(semConteo[s]||0)+1;
  });
  const semTop=Object.entries(semConteo).sort((a,b)=>a[0].localeCompare(b[0]));
  const maxSem=Math.max(...semTop.map(s=>s[1]),1);

  // Tabla comparativa
  const tabla = listaAlumnos.filter(a=>a.total>0).sort((a,b)=>b.total-a.total).slice(0,15);
  const filasTabla = tabla.length===0
    ? `<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">Sin actividad registrada.</td></tr>`
    : tabla.map((a,i)=>`
      <tr style="background:${i%2===0?'transparent':'var(--surface-1)'};">
        <td style="padding:8px 10px;font-weight:600;font-size:13px;">${esc(a.nombre)}</td>
        <td style="padding:8px 10px;text-align:center;font-size:13px;">${a.visitas}</td>
        <td style="padding:8px 10px;text-align:center;font-size:13px;">${a.procedimientos}</td>
        <td style="padding:8px 10px;text-align:center;font-size:13px;">${a.pacientes}</td>
        <td style="padding:8px 10px;text-align:center;font-size:13px;">${a.consentimientos}</td>
        <td style="padding:8px 10px;text-align:center;font-size:13px;">${a.ceye}</td>
        <td style="padding:8px 10px;text-align:center;font-size:13px;">${a.asistencias}</td>
      </tr>`).join('');

  html+=`<p class="section-label">Control por alumno</p>
  <div class="hero-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px;">
    <div class="hero-card"><p class="hero-value">${totalAlumnos}</p><p class="hero-label">Alumnos registrados</p></div>
    <div class="hero-card"><p class="hero-value">${alumnosActivos}</p><p class="hero-label">Con actividad clínica</p></div>
    <div class="hero-card"><p class="hero-value">${totalPacAtendidos}</p><p class="hero-label">Pacientes atendidos</p></div>
    <div class="hero-card"><p class="hero-value">${promVisitas}</p><p class="hero-label">Visitas por alumno</p></div>
  </div>
  <div class="mod-grid">
    <div class="mod-card">
      <div class="mod-head"><span class="mod-title">Visitas atendidas por alumno</span></div>
      ${barChart(topVisitas,maxVis)}
    </div>
    <div class="mod-card">
      <div class="mod-head"><span class="mod-title">Procedimientos por alumno</span></div>
      ${barChart(topProcs,maxPr)}
    </div>
    <div class="mod-card">
      <div class="mod-head"><span class="mod-title">Pacientes distintos por alumno</span></div>
      ${barChart(topPacientes,maxPa)}
    </div>
    <div class="mod-card">
      <div class="mod-head"><span class="mod-title">Alumnos por semestre</span></div>
      ${barChart(semTop,maxSem)}
    </div>
  </div>

  <div class="mod-card" style="margin-top:14px;overflow-x:auto;">
    <div class="mod-head"><span class="mod-title">Detalle comparativo por alumno</span></div>
    <table style="width:100%;border-collapse:collapse;margin-top:10px;min-width:620px;">
      <thead>
        <tr style="border-bottom:2px solid var(--border);">
          <th style="padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">Alumno</th>
          <th style="padding:8px 10px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">Visitas</th>
          <th style="padding:8px 10px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">Proced.</th>
          <th style="padding:8px 10px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">Pacientes</th>
          <th style="padding:8px 10px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">Consent.</th>
          <th style="padding:8px 10px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">CeYE</th>
          <th style="padding:8px 10px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">Asist.</th>
        </tr>
      </thead>
      <tbody>${filasTabla}</tbody>
    </table>
  </div>`;

  /* ══ Detalle por módulo ══ */
  html+=`<p class="section-label">Detalle por módulo</p><div class="mod-grid">`;

  // Expedientes
  const tiposPac={};
  D.expedientes.forEach(e=>{ tiposPac[e.tipo_paciente||'Sin tipo']=(tiposPac[e.tipo_paciente||'Sin tipo']||0)+1; });
  const tiposTop=Object.entries(tiposPac).sort((a,b)=>b[1]-a[1]).slice(0,5);
  html+=`<div class="mod-card">
    <div class="mod-head"><span class="mod-title">Expedientes</span></div>
    ${statRows([['Total',D.expedientes.length]])}
    ${barChart(tiposTop,Math.max(...tiposTop.map(t=>t[1]),1))}
  </div>`;

  // Préstamos
  const prestActivos=D.prestamos.filter(p=>p.estado!=='Devuelto').length;
  html+=`<div class="mod-card">
    <div class="mod-head"><span class="mod-title">Préstamos</span></div>
    ${statRows([['Total',D.prestamos.length],['Activos',prestActivos],['Equipos en catálogo',D.equipos.length]])}
  </div>`;

  // CeYE
  const ceyePend=D.ceye.filter(c=>c.estado==='pendiente').length;
  html+=`<div class="mod-card">
    <div class="mod-head"><span class="mod-title">CeYE</span></div>
    ${statRows([['Total registros',D.ceye.length],['Pendientes',ceyePend],['Esterilizados',D.ceye.length-ceyePend]])}
  </div>`;

  // Asistencia
  const asistHoy=D.asistencia.filter(r=>r.fecha===hoy).length;
  const asistSSHoy=D.asistenciaSS.filter(r=>r.fecha===hoy).length;
  html+=`<div class="mod-card">
    <div class="mod-head"><span class="mod-title">Asistencia</span></div>
    ${statRows([['Registros docentes',D.asistencia.length,asistHoy],['Registros servicio social',D.asistenciaSS.length,asistSSHoy]])}
  </div>`;

  // Documentos
  const justSolo=D.justificantes.filter(j=>j.tipo==='justificante').length;
  const recetas=D.justificantes.filter(j=>j.tipo==='receta').length;
  html+=`<div class="mod-card">
    <div class="mod-head"><span class="mod-title">Documentos emitidos</span></div>
    ${statRows([['Justificantes',justSolo],['Recetas',recetas],['Consentimientos',D.consentimientos.length]])}
  </div>`;

  // Banco de pacientes
  const bancoAsignados=D.banco.filter(b=>b.alumno).length;
  html+=`<div class="mod-card">
    <div class="mod-head"><span class="mod-title">Banco de pacientes</span></div>
    ${statRows([['Total',D.banco.length],['Asignados',bancoAsignados],['Sin asignar',D.banco.length-bancoAsignados]])}
  </div>`;

  html+=`</div>`;

  document.getElementById('dashboard').innerHTML=html;
}

async function inicializar(){
  const d = await cargarTodosLosDatos();
  Object.assign(datos, d);
  renderAll();
}
inicializar();

function render(){ renderAll(); }



/* ── Realtime: sincronización automática entre dispositivos ── */
sbST.channel('estadisticas_expedientes').on('postgres_changes',{event:'*',schema:'public',table:'expedientes'},async()=>{ const d = await cargarTodosLosDatos(); Object.assign(datos, d); render(); }).subscribe();
sbST.channel('estadisticas_alumnos').on('postgres_changes',{event:'*',schema:'public',table:'alumnos'},async()=>{ const d = await cargarTodosLosDatos(); Object.assign(datos, d); render(); }).subscribe();
sbST.channel('estadisticas_maestros').on('postgres_changes',{event:'*',schema:'public',table:'maestros'},async()=>{ const d = await cargarTodosLosDatos(); Object.assign(datos, d); render(); }).subscribe();
sbST.channel('estadisticas_pagos_visitas').on('postgres_changes',{event:'*',schema:'public',table:'pagos_visitas'},async()=>{ const d = await cargarTodosLosDatos(); Object.assign(datos, d); render(); }).subscribe();
sbST.channel('estadisticas_prestamos').on('postgres_changes',{event:'*',schema:'public',table:'prestamos'},async()=>{ const d = await cargarTodosLosDatos(); Object.assign(datos, d); render(); }).subscribe();
</script>
